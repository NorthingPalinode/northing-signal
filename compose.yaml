services:
  northing-signal:
    build: .
    ports:
      # Local single-user app without authentication: keep the host side on loopback.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - cfaw-data:/app/.local
volumes:
  # Keep the existing volume key so an upgrade reuses the reader's data.
  cfaw-data:

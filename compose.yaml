services:
  northing-signal:
    build: .
    ports:
      # Readers sign in with tokens (READER_AUTH=token, the default). Serve it through an HTTPS
      # reverse proxy (Caddy, Nginx) on this host and keep the container port on loopback.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - cfaw-data:/app/.local
volumes:
  # Keep the existing volume key so an upgrade reuses the reader's data.
  cfaw-data:

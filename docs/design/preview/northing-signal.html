<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northing Signal · 设计基准</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1e24; --ink-2:#4a505b; --muted:#7a808b; --faint:#a9aeb7;
  --win:rgb(255 255 255 / 86%); --win-solid:#fbfbfc; --well:#f2f3f5; --well-2:#e9ebef;
  --line:rgb(27 30 36 / 8%); --line-2:rgb(27 30 36 / 14%);
  --blue:#2f63f0; --blue-soft:rgb(47 99 240 / 9%);
  --t-models:#6b56e8; --t-agents:#0e9f78; --t-research:#d38a0b; --t-engineering:#2f63f0; --t-products:#df3f83; --t-industry:#e05a33;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.4,.64,1);
  --sans:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --dw:264px;
}
.collapsed{--dw:0px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{color:var(--ink);font:14.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;background:#d9dde2}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.wall{position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,#dfe3e8,#e9e2d8 55%,#d6ded6);overflow:hidden}
.wall i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:drift 28s ease-in-out infinite alternate}
.wall i:nth-child(1){width:620px;height:620px;left:-120px;top:-160px;background:#b9c9e6}
.wall i:nth-child(2){width:520px;height:520px;right:-100px;top:20%;background:#efd5c0;animation-duration:34s}
.wall i:nth-child(3){width:560px;height:560px;left:30%;bottom:-260px;background:#c4dccd;animation-duration:40s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.08)}}
.shell{display:grid;grid-template-columns:var(--dw) minmax(0,1fr);height:100%;transition:grid-template-columns .5s var(--ease)}

/* sidebar */
#drawer{display:flex;flex-direction:column;padding:14px 10px 14px 12px;min-width:0;overflow:hidden;transition:transform .5s var(--ease),opacity .3s}
.d-head{display:flex;align-items:center;gap:8px;padding:2px 4px 14px;height:44px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap}
.brand-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(145deg,#3b6ff5,#1f4fd6);display:grid;place-items:center;box-shadow:0 2px 6px -2px rgb(47 99 240 / 50%)}
.d-head .sp{flex:1}
.tb{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);transition:background .2s}
.tb:hover{background:rgb(255 255 255 / 55%)}
.d-search{display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;margin:0 2px 12px;border-radius:10px;background:rgb(255 255 255 / 45%);box-shadow:inset 0 0 0 1px rgb(255 255 255 / 60%);color:var(--muted);font-size:13.5px;white-space:nowrap;transition:background .2s}
.d-search:hover{background:rgb(255 255 255 / 70%)}
.d-search svg{flex:none}
.d-search kbd{margin-left:auto;font:11.5px var(--sans);color:var(--faint)}
#drawer nav{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:1px}
.nav-ind{position:absolute;left:0;right:0;top:0;border-radius:10px;background:rgb(255 255 255 / 85%);box-shadow:0 1px 2px rgb(27 30 36 / 8%),0 4px 14px -4px rgb(27 30 36 / 12%);opacity:0;transition:transform .45s var(--spring),height .3s,opacity .2s;pointer-events:none}
#drawer nav button{position:relative;min-width:0;display:flex;align-items:center;gap:11px;height:36px;padding:0 10px;border-radius:10px;font-size:14px;color:var(--ink-2);white-space:nowrap;transition:background .2s,color .2s}
#drawer nav button:hover{background:rgb(255 255 255 / 35%)}
#drawer nav button[aria-current]{color:var(--ink);font-weight:500}
#drawer nav button svg{flex:none;color:var(--muted)}
#drawer nav button[aria-current] svg{color:var(--blue)}
#drawer nav b{margin-left:auto;font:600 11.5px var(--sans);color:var(--muted)}
#drawer nav b:empty{display:none}
#drawer nav b.hot{color:#fff;background:var(--blue);border-radius:9px;padding:0 7px;line-height:18px}
.d-label{display:flex;justify-content:space-between;padding:16px 12px 6px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.co-ico{flex:none;width:20px;height:20px;border-radius:6px;background:#fff;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;font:600 9.5px var(--sans);color:var(--ink)}
.fl-ico{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.fl-ico i{width:7px;height:7px;border-radius:50%;background:var(--t-agents);box-shadow:0 0 0 3px rgb(14 159 120 / 18%)}
.fl-ico i.off{background:var(--faint);box-shadow:none}
.d-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;font-size:12.5px;color:var(--muted);white-space:nowrap}
.d-foot svg{flex:none}
/* hidden + peek */
.hot-edge{position:fixed;left:0;top:0;bottom:0;width:14px;z-index:30;display:none}
.collapsed .hot-edge{display:block}
.collapsed #drawer{position:fixed;left:8px;top:8px;bottom:8px;width:256px;z-index:31;border-radius:16px;background:rgb(246 247 249 / 82%);backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 1px rgb(255 255 255 / 60%),0 30px 70px -20px rgb(27 30 36 / 35%);transform:translateX(calc(-100% - 20px));opacity:.6}
.collapsed.peek #drawer{transform:none;opacity:1}

/* window */
.window{grid-column:2;position:relative;margin:10px 10px 10px 4px;border-radius:14px;background:var(--win);backdrop-filter:blur(40px) saturate(1.4);box-shadow:0 0 0 1px rgb(255 255 255 / 70%),0 1px 2px rgb(27 30 36 / 6%),0 30px 80px -30px rgb(27 30 36 / 30%);display:flex;flex-direction:column;min-width:0;overflow:hidden;transition:margin .5s var(--ease)}
.collapsed .window{margin-left:10px}
.w-bar{display:flex;align-items:center;gap:6px;height:48px;padding:0 12px;border-bottom:1px solid var(--line);flex:none}
.w-bar .crumb{flex:1;text-align:center;font-size:13px;font-weight:500;color:var(--ink-2)}
.w-bar .open-side{display:none}
.collapsed .w-bar .open-side{display:grid}
#scroller{flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--well-2) transparent}
#view{max-width:1040px;margin:0 auto;padding:40px 52px 100px;transition:opacity .18s,transform .18s}
#view.out{opacity:0;transform:scale(.985)}
#view.in>*{animation:fade .6s var(--ease) both}
#view.in>*:nth-child(2){animation-delay:.04s}#view.in>*:nth-child(3){animation-delay:.08s}#view.in>*:nth-child(4){animation-delay:.12s}#view.in>*:nth-child(n+5){animation-delay:.16s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}

.v-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.v-head h1{margin:0;font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.025em}
.v-sub{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:9px;background:#fff;box-shadow:0 0 0 1px var(--line-2),0 1px 2px rgb(27 30 36 / 6%);font-size:13.5px;font-weight:500;text-decoration:none;color:var(--ink);transition:all .2s}
.btn:hover{box-shadow:0 0 0 1px rgb(27 30 36 / 22%),0 2px 6px rgb(27 30 36 / 8%)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 1px 2px rgb(47 99 240 / 30%),inset 0 1px 0 rgb(255 255 255 / 20%)}
.btn.primary:hover{background:#2756d8}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--well)}
.btn.on{background:var(--blue-soft);color:var(--blue);box-shadow:inset 0 0 0 1px rgb(47 99 240 / 25%)}
.btn[disabled]{opacity:.6}
.icon-btn{flex:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:all .2s}
.icon-btn:hover{background:var(--well);color:var(--ink)}
.icon-btn.on{color:var(--blue)}
.icon-btn.on svg{animation:pop .4s var(--spring)}
@keyframes pop{50%{transform:scale(1.3)}}
.v-progress{display:flex;align-items:center;gap:12px;margin:-12px 0 24px;font-size:12.5px;color:var(--ink-2)}
.v-progress i{flex:0 0 200px;height:5px;border-radius:3px;background:var(--well-2);overflow:hidden}
.v-progress b{display:block;height:100%;width:0;border-radius:3px;background:var(--blue);transition:width .2s}

.since{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start;padding:18px;border-radius:16px;background:linear-gradient(120deg,rgb(47 99 240 / 7%),rgb(223 63 131 / 4%));box-shadow:inset 0 0 0 1px rgb(47 99 240 / 10%);margin-bottom:44px}
.since-h{display:flex;flex-direction:column;padding:6px}
.since-h b{font-size:48px;line-height:1;font-weight:700;letter-spacing:-.04em;background:linear-gradient(135deg,#2f63f0,#8a5cf0);-webkit-background-clip:text;color:transparent}
.since-h span{margin-top:6px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.since-h small{color:var(--muted)}
.since-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.since-item{text-align:left;padding:10px 12px;border-radius:11px;background:#fff;box-shadow:0 0 0 1px var(--line),0 1px 2px rgb(27 30 36 / 4%);font-size:13px;line-height:1.5;display:grid;gap:3px;transition:transform .25s var(--ease),box-shadow .25s}
.since-item:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--line-2),0 8px 20px -8px rgb(27 30 36 / 20%)}
.since-item>span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s-flag{justify-self:start;font-size:11px;font-weight:600;color:var(--blue);background:var(--blue-soft);border-radius:5px;padding:1px 6px}
.s-flag.warn{color:var(--t-industry);background:rgb(224 90 51 / 10%)}

.v-section{margin-top:44px}
.v-sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.v-sh h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.015em}
.v-sh span{font-size:12.5px;color:var(--muted)}
.leads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.s-lead{display:grid;grid-template-columns:40px minmax(0,1fr);padding:20px 20px 16px 16px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line),0 1px 3px rgb(27 30 36 / 5%);cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s}
.s-lead:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--line-2),0 18px 40px -18px rgb(27 30 36 / 28%)}
.s-lead:first-child{grid-column:1/-1;grid-template-columns:56px minmax(0,1fr);padding:26px 26px 22px 20px;background:linear-gradient(180deg,#fff,#fbfbfd)}
.s-lead:first-child .s-title{font-size:26px;line-height:1.35}
.s-lead:first-child .s-sum{-webkit-line-clamp:3;font-size:15px}
.s-no{width:28px;height:28px;border-radius:8px;background:var(--well);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.s-lead:first-child .s-no{width:36px;height:36px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px}
.s-meta,.r-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.s-topic{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;color:var(--tc);background:color-mix(in srgb,var(--tc) 9%,white)}
.s-title{margin:8px 0 0;font-size:17px;line-height:1.45;font-weight:600;letter-spacing:-.01em}
.s-sum{margin:8px 0 0;color:var(--ink-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s-why{margin:14px 0 0;padding:10px 12px;border-radius:10px;background:var(--well);font-size:13.5px;color:var(--ink)}
.s-why span{font-weight:600;color:var(--blue);margin-right:8px;font-size:12px}
.s-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.s-ev{font-size:12px;color:var(--muted)}
.known .s-title,.known h3{color:var(--faint)}
.chips{display:inline-flex;gap:2px;flex-wrap:wrap;padding:3px;border-radius:10px;background:var(--well);margin-bottom:10px}
.chip{height:30px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--ink-2);transition:all .2s}
.chip:hover{color:var(--ink)}
.chip[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgb(27 30 36 / 10%),0 0 0 1px var(--line)}
.rows{display:grid;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.s-row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 14px;cursor:pointer;transition:background .15s}
.s-row+.s-row{border-top:1px solid var(--line)}
.s-row:hover{background:#f7f8fa}
.s-dot{width:7px;height:7px;border-radius:50%;background:var(--tc)}
.s-row .s-title{margin:0 0 3px;font-size:14.5px;font-weight:500}
.s-row .s-topic{height:auto;padding:0;background:none}
.rows mark{background:rgb(47 99 240 / 14%);color:inherit;border-radius:3px;padding:0 2px}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;font-weight:600}

.tabs{position:relative;display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--well);margin-bottom:26px}
.tab{position:relative;z-index:1;height:32px;padding:0 16px;font-size:13.5px;color:var(--ink-2);transition:color .2s}
.tab[aria-selected=true]{color:var(--ink);font-weight:500}
.tab-ind{position:absolute;top:3px;bottom:3px;border-radius:8px;background:#fff;box-shadow:0 1px 2px rgb(27 30 36 / 10%),0 0 0 1px var(--line);transition:left .4s var(--spring),width .4s var(--spring)}
.co-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.co-card{position:relative;overflow:hidden;display:flex!important;flex-direction:column;align-items:flex-start;min-height:170px;padding:20px!important;border-radius:18px!important}
.co-card::before{content:"";position:absolute;inset:0;background:radial-gradient(220px 140px at 0 0,color-mix(in srgb,var(--brand) 16%,transparent),transparent 70%);opacity:.8;transition:opacity .3s;pointer-events:none}
.co-card:hover::before{opacity:1}
.co-card .co-logo{position:relative;width:56px;height:56px;border-radius:16px;background:#fff;color:var(--brand);font-size:17px;box-shadow:0 0 0 1px var(--line-2),0 6px 16px -8px color-mix(in srgb,var(--brand) 60%,transparent)}
.co-card .co-name{position:relative;margin-top:auto;padding-top:22px;font-size:17px;font-weight:700;letter-spacing:-.015em}
.co-card .co-count{position:absolute;top:20px;right:20px;margin:0;height:auto;padding:0;background:none;display:block;text-align:right;font-size:12px;font-weight:500;color:var(--muted)}
.co-card .co-count b{display:block;font-size:30px;line-height:1;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.co-card .co-fresh{position:relative;margin-top:6px;font-size:12px;font-weight:600;color:var(--blue)}
.co-card.quiet{min-height:0;flex-direction:row;align-items:center;gap:12px;padding:14px!important;opacity:1;filter:grayscale(1);color:var(--muted)}
.co-card.quiet::before{display:none}
.co-card.quiet .co-logo{width:36px;height:36px;border-radius:11px;font-size:12px;box-shadow:0 0 0 1px var(--line)}
.co-card.quiet .co-name{margin:0;padding:0;font-size:14px;font-weight:500}
.co-quiet{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:10px}
.ev-chart{position:relative;margin-top:6px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);padding:8px 0 4px;overflow-x:auto}
.ev-chart svg{display:block}
.ev-chart .dot{transition:opacity .3s,transform .35s var(--ease);transform-box:fill-box;transform-origin:center}
.ev-chart.pre .dot{opacity:0;transform:scale(.2)}
.ev-tip{position:absolute;z-index:4;pointer-events:none;max-width:300px;padding:9px 11px;border-radius:10px;background:rgb(30 32 38 / 92%);color:#fff;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .12s}
.ev-tip.on{opacity:1}
.ev-tip small{display:block;color:rgb(255 255 255 / 65%)}
.ev-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 10px}
.ev-legend span{display:inline-flex;align-items:center;gap:6px}
.ev-check{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.ev-check div{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;background:var(--well);font-size:12.5px;color:var(--muted)}
.ev-check div.ok{background:rgb(14 159 120 / 10%);color:var(--ink)}
.ev-check i{flex:none;width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--faint)}
.ev-check .ok i{background:var(--t-agents);box-shadow:none}
.co-card{text-align:left;padding:16px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line),0 1px 2px rgb(27 30 36 / 4%);transition:transform .25s var(--ease),box-shadow .25s}
.co-card:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--line-2),0 14px 30px -14px rgb(27 30 36 / 25%)}
.co-card.quiet{opacity:.55}
.co-top{display:flex;align-items:center;gap:11px}
.co-logo{flex:none;width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,#fff,#eef0f3);box-shadow:0 0 0 1px var(--line-2),0 1px 2px rgb(27 30 36 / 6%);display:grid;place-items:center;font-weight:700;font-size:13px}
.co-name{display:block;font-weight:600}
.co-top small{font-size:12px;color:var(--muted)}
.co-count{margin-left:auto;min-width:30px;height:26px;padding:0 9px;border-radius:13px;background:var(--well);display:grid;place-items:center;font-weight:600;font-size:13px}
.co-card ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:5px;font-size:13px;color:var(--ink-2)}
.co-card li{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.co-hero{display:flex;align-items:center;gap:16px;margin:20px 0 24px;padding:20px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.co-hero .co-logo{width:60px;height:60px;border-radius:16px;font-size:20px}
.co-hero h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.co-hero p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.co-n{margin-left:auto;text-align:right;color:var(--muted);font-size:12.5px}
.co-n b{display:block;font-size:34px;line-height:1;color:var(--ink);letter-spacing:-.03em}
.co-line{list-style:none;margin:0;padding:0 0 0 8px;position:relative}
.co-line::before{content:"";position:absolute;left:12px;top:10px;bottom:10px;width:2px;border-radius:1px;background:var(--well-2)}
.co-line li{position:relative;display:grid;grid-template-columns:minmax(0,1fr);padding:10px 0 10px 28px;cursor:pointer}
.co-line li::before{content:"";position:absolute;left:0;top:18px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--blue)}
.co-line time{font-size:12px;color:var(--muted)}
.co-line div{padding:12px 14px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px var(--line);margin-top:4px;transition:box-shadow .2s}
.co-line li:hover div{box-shadow:0 0 0 1px var(--blue)}
.co-line h3{margin:6px 0 2px;font-size:15px;font-weight:600}
.co-line p{margin:0;font-size:12.5px;color:var(--muted)}
.rk{list-style:none;margin:8px 0 0;padding:0;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.rk-row{display:grid;grid-template-columns:36px minmax(0,1fr) 140px;gap:14px;align-items:center;padding:14px 16px}
.rk-row+.rk-row{border-top:1px solid var(--line)}
.rk-i{width:26px;height:26px;border-radius:7px;background:var(--well);display:grid;place-items:center;font-size:12px;font-weight:600}
.rk-main b{font-weight:600;font-size:14px}
.rk-main p{margin:1px 0 8px;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.rk-bar{display:block;height:5px;border-radius:3px;background:var(--well)}
.rk-bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#2f63f0,#8a5cf0);transition:width 1s var(--ease)}
.rk-bar i.go{width:var(--w)}
.rk-v{text-align:right}
.rk-v b{display:block;font-size:16px;font-weight:700}
.rk-v small{font-size:12px;color:var(--muted)}

.search-box{display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line-2),0 2px 8px -2px rgb(27 30 36 / 8%);color:var(--muted);transition:box-shadow .2s}
.search-box:focus-within{box-shadow:0 0 0 2px var(--blue),0 0 0 6px rgb(47 99 240 / 14%)}
.search-box input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:400 18px var(--sans)}
.search-box kbd{font:12px var(--sans);color:var(--faint)}
.sugg{margin:14px 0 22px}
.v-count{font-size:12.5px;color:var(--muted)}

.fl-new{margin-bottom:20px}
.fl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.fl-card{padding:18px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line),0 1px 3px rgb(27 30 36 / 5%)}
.fl-top{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.fl-state{font-weight:600;font-size:11.5px;padding:1px 8px;border-radius:6px;background:var(--well);color:var(--muted)}
.fl-state.on{background:rgb(14 159 120 / 12%);color:var(--t-agents)}
.fl-card h3{margin:10px 0 2px;font-size:17px;font-weight:700}
.fl-q{margin:0;color:var(--muted);font-size:13px}
.fl-hits{display:grid;margin:14px 0;border-radius:11px;background:var(--well);padding:4px}
.fl-hits button{display:flex;justify-content:space-between;gap:12px;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;transition:background .15s}
.fl-hits button:hover{background:#fff}
.fl-hits small{flex:none;color:var(--muted)}
.fl-act{display:flex;gap:8px}
.fl-act .btn.ghost{box-shadow:0 0 0 1px var(--line-2)}

.saved-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sv-card{display:flex;flex-direction:column;padding:18px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line),0 1px 3px rgb(27 30 36 / 5%);cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s;position:relative;overflow:hidden}
.sv-card::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--tc)}
.sv-card:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--line-2),0 18px 40px -18px rgb(27 30 36 / 28%)}
.sv-card h3{margin:10px 0 0;font-size:16px;font-weight:600;line-height:1.45}
.sv-card p{margin:8px 0 0;color:var(--ink-2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sv-card .s-foot{margin-top:auto;padding-top:12px}

.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.stats div{padding:16px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.stats b{display:block;font-size:28px;font-weight:700;letter-spacing:-.03em}
.stats span{font-size:12.5px;color:var(--muted)}
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.src{display:grid;grid-template-columns:10px minmax(0,1fr);gap:1px 10px;align-items:center;padding:10px 12px;border-radius:11px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.src b{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src small{grid-column:2;font-size:12px;color:var(--muted)}
.src-dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.src-dot.ok{background:var(--t-agents)}
.src-dot.err{background:var(--t-industry)}

.reader{max-width:820px;margin:0 auto}
.r-bar{display:flex;align-items:center;gap:4px;margin-bottom:30px}
.r-pos{margin-left:auto;font-size:12.5px;color:var(--muted);margin-right:6px}
.reader h1{margin:12px 0 0;font-size:34px;line-height:1.3;font-weight:700;letter-spacing:-.025em}
.r-sum{margin:18px 0 0;font-size:16.5px;line-height:1.85;color:var(--ink-2)}
.r-why{margin-top:22px;padding:16px 18px;border-radius:14px;background:linear-gradient(120deg,rgb(47 99 240 / 8%),rgb(138 92 240 / 5%))}
.r-why span{font-size:12px;font-weight:600;color:var(--blue)}
.r-why p{margin:4px 0 0;font-size:15px}
.r-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.r-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;margin-top:32px;align-items:start}
.r-grid>div,.r-grid>section{padding:18px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.r-sec+.r-sec{margin-top:22px}
.r-sec h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.r-list{margin:0;padding:0 0 0 1.1em;display:grid;gap:6px;font-size:14px}
.r-list.muted{color:var(--ink-2)}
.r-standing{margin:0;font-size:13.5px;color:var(--ink-2)}
.tl{list-style:none;margin:0;padding:0;max-height:520px;overflow:auto;scrollbar-width:thin}
.tl-day+.tl-day{margin-top:12px}
.tl-h{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}
.tl-h b{font-size:11.5px;font-weight:700;color:var(--ink);background:var(--well);border-radius:6px;padding:1px 7px}
.tl-item{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;padding:6px 0}
.tl-item i{width:8px;height:8px;border-radius:50%;margin-top:7px;box-shadow:inset 0 0 0 1.5px var(--faint)}
.tl-item[data-stage=statement] i{background:var(--blue);box-shadow:0 0 0 3px rgb(47 99 240 / 15%)}
.tl-item[data-stage=change] i{background:var(--t-industry);box-shadow:none}
.tl-item small{font-size:12px;color:var(--muted)}
.tl-item em{font-style:normal;font-weight:500;color:var(--ink-2)}
.tl-item p{margin:0;font-size:13.5px}

#toast{position:fixed;left:50%;top:22px;z-index:60;transform:translate(-50%,-12px) scale(.96);opacity:0;padding:9px 16px;border-radius:12px;background:rgb(30 32 38 / 88%);backdrop-filter:blur(12px);color:#fff;font-size:13.5px;font-weight:500;box-shadow:0 12px 30px -10px rgb(0 0 0 / 40%);transition:all .35s var(--spring);pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){.since{grid-template-columns:1fr}.since-list{grid-template-columns:repeat(2,minmax(0,1fr))}.r-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){
  body{overflow:auto}
  :root{--dw:0px}
  .shell{display:block;height:auto}
  #drawer{position:fixed;left:8px;top:8px;bottom:8px;width:270px;z-index:31;border-radius:16px;background:rgb(246 247 249 / 92%);backdrop-filter:blur(30px);box-shadow:0 30px 70px -20px rgb(27 30 36 / 45%);transform:translateX(calc(-100% - 20px))}
  .menu-open #drawer{transform:none}
  .window{margin:0;border-radius:0;min-height:100vh}
  .w-bar{position:sticky;top:0;z-index:5;background:rgb(255 255 255 / 85%);backdrop-filter:blur(14px)}
  .w-bar .open-side{display:grid!important}
  #scroller{overflow:visible}
  #view{padding:22px 16px 80px}
  .leads{grid-template-columns:1fr}.s-lead:first-child .s-title{font-size:21px}
  .since-list{grid-template-columns:1fr}.fl-list{grid-template-columns:1fr}
  .rk-row{grid-template-columns:30px minmax(0,1fr)}.rk-v{grid-column:2;text-align:left}
  .stats{grid-template-columns:repeat(2,1fr)}.reader h1{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="hot-edge" onmouseenter="document.documentElement.classList.add('peek')"></div>
<div class="shell">
  <aside id="drawer" aria-label="导航" onmouseleave="document.documentElement.classList.remove('peek')" onclick="if(event.target.closest('[data-page]'))document.documentElement.classList.remove('menu-open','peek')">
    <div class="d-head">
      <span class="brand"><span class="brand-mark"><svg width="14" height="14" viewBox="0 0 22 22"><path d="M5 17V5l12 12V5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Northing Signal</span>
      <span class="sp"></span>
      <button class="tb" data-collapse aria-label="隐藏侧栏（[）" title="隐藏侧栏（[）"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path d="M9.5 4.5v15"/></svg></button>
    </div>
    <button class="d-search" data-page="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>搜索</span><kbd>/</kbd></button>
    <nav aria-label="主要导航">
      <i class="nav-ind"></i>
      <button data-page="briefing"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4.5h14v15H5z"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"/></svg>今日简报<b class="hot" data-badge="new"></b></button>
      <button data-page="trends"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3.5 16.5 5.5-5.5 4 4 7.5-7.5M15 7.5h5.5V13"/></svg>动向</button>
      <button data-page="following"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>追踪</button>
      <button data-page="saved"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>收藏<b data-badge="saved"></b></button>
      <button data-page="library"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4.5 5h4v14h-4zM10 5h4v14h-4zM16 6l3.5-1 2.5 13.5-3.5.8z"/></svg>资料库</button>
    </nav>
    <div class="d-label"><span>固定的公司</span></div>
    <nav aria-label="固定的公司">
      <i class="nav-ind"></i>
      <button data-page="trends" data-coid="nvidia"><span class="co-ico">NV</span>NVIDIA<b>18</b></button>
      <button data-page="trends" data-coid="openai"><span class="co-ico">Op</span>OpenAI<b>11</b></button>
      <button data-page="trends" data-coid="anthropic"><span class="co-ico">An</span>Anthropic<b>9</b></button>
    </nav>
    <div class="d-label"><span>追踪话题</span></div>
    <nav aria-label="追踪话题">
      <i class="nav-ind"></i>
      <button data-page="following" data-coid=""><span class="fl-ico"><i></i></span>开源推理框架发布</button>
      <button data-page="following" data-coid=""><span class="fl-ico"><i class="off"></i></span>AI 芯片与算力</button>
    </nav>
    <div class="d-foot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>下次自动更新 12:00</div>
  </aside>
  <section class="window">
    <div class="w-bar">
      <button class="icon-btn open-side" aria-label="显示侧栏" onclick="if(innerWidth<760)document.documentElement.classList.add('menu-open');else document.querySelector('[data-collapse]').click()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path d="M9.5 4.5v15"/></svg></button>
      <button class="icon-btn" aria-label="后退" onclick="history.back()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="icon-btn" aria-label="前进" onclick="history.forward()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>
      <span class="crumb" id="crumb">Northing Signal</span>
      <button class="icon-btn" aria-label="搜索" onclick="App.go('search')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    </div>
    <div id="scroller"><main id="view" aria-live="polite"></main></div>
  </section>
</div>

<script>
// window title follows the page
new MutationObserver(() => (document.getElementById("crumb").textContent = document.title.replace("Northing Signal · ", "Northing Signal — "))).observe(document.querySelector("title"), { childList: true });
</script>

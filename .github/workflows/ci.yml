name: starter-checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Preservation tests compare fixture bytes with earlier frozen commits.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check backend tests_reader
      - name: Product regressions and shared public-network boundary
        run: python -m pytest -q --basetemp .tmp/ci-tests --junitxml .tmp/ci-tests.xml
      - run: npm ci --no-audit --no-fund && npm test && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-check-evidence
          path: |
            .tmp/ci-tests.xml

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f3" />
    <script>
      // Same rule as src/theme.ts, inline so the first paint already has the right colours.
      (function () {
        var choice = "auto";
        try { choice = localStorage.getItem("ns-theme") || "auto"; } catch (e) {}
        var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#131417" : "#f6f6f3";
      })();
    </script>
    <meta name="description" content="AI，值得知道的变化。把发布、实测与观点分开，回到原始依据。" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand.svg?no-inline" />
    <title>Northing Signal · AI 简报</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>

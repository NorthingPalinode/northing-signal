[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "northing-signal"
dynamic = ["version"]
description = "A local AI intelligence reader with evidence and confirmed topic tracking"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "httpx>=0.28,<1", "pydantic>=2.9,<3", "pydantic-settings>=2.8,<3", "feedparser>=6.0,<7",
  "trafilatura==2.3.1", "lxml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.dynamic]
version = {attr = "northing_signal.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests_reader"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
